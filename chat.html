<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 사주 천년지기 - 2027 정미년</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="nav"><a class="logo">AI 사주 <span>천년지기</span></a><nav><a href="index.html">홈</a><a href="chat.html">대화형 사주</a><a href="tojeong.html">토정비결 2027</a><a href="admin.html">관리자</a></nav><div class="coins">내 코인 <b data-coins>30코인</b> · <button onclick="document.getElementById('chargeModal').classList.add('open')">충전</button></div></header>
<main>
<section><h2>대화형 사주</h2><p>내 코인 <b data-coins></b> · 질문당 100원(1코인)부터</p><div class="chat"><div id="chatBox" class="chatbox"><div class="ai">안녕하세요. 생년월일시를 입력하면 당신의 사주로 답해드려요. 홈에서 계산하거나, 여기서 바로 물어보세요.</div></div><div class="quick"><button onclick="ask('올해 이직해도 될까요?')">올해 이직 시기 (3코인)</button><button onclick="ask('연애운은 어때요?')">연애운 (3코인)</button><button onclick="ask('재물운은 어때요?')">재물운 (3코인)</button><button onclick="ask('오늘 운세 알려줘')">오늘 운세 (1코인)</button></div><div class="input"><input id="q" placeholder="궁금한 걸 물어보세요..."><button onclick="ask(document.getElementById('q').value)">전송</button></div></div></section>
<script>function ask(q){ if(!q) return; const type=q.includes('오늘')? 'light':'deep'; if(!deduct(type)) return; const box=document.getElementById('chatBox'); box.innerHTML+='<div class="user">'+q+'</div>'; const ans=answerFor(q, state.saju); setTimeout(()=>{ box.innerHTML+='<div class="ai">'+ans+'</div>'; box.scrollTop=9999; },400); document.getElementById('q').value=''; }</script>
</main>
<div id="chargeModal" class="modal"><div class="modal-box"><h3>코인 충전 - 토스페이먼츠</h3><p>가입 축하 30코인 무료 지급 중</p><div class="packs"><button onclick="startToss(5000,50)">5,000원 → 50코인</button><button class="hot" onclick="startToss(10000,110)">10,000원 → 110코인 (+10)</button><button onclick="startToss(20000,240)">20,000원 → 240코인 (+40)</button></div><label>결제수단</label><div class="pay"><span class="sel">토스페이</span><span>카드</span><span>계좌이체</span><span>휴대폰</span></div><p class="note">실제 결제는 서버 승인 API(/api/payments/confirm) 후 코인 지급. 테스트 키로 연동하세요.</p><button onclick="document.getElementById('chargeModal').classList.remove('open')">닫기</button></div></div><div id="toast"></div>
<script src="js/manse.js"></script><script src="js/app.js"></script><script>renderCoins(); function startToss(won,coins){ alert('토스페이먼츠 결제창 호출 (데모)\n'+won.toLocaleString()+'원 → '+coins+'코인\n서버 승인 후 지급됩니다. server/server.js 참고'); }</script></body></html>
